services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: product-services

    ports:
      - "8001:8001"

    volumes:
      - ".:/app"

    environment:
      DEBUG: "True"

    env_file:
      - .env

    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload