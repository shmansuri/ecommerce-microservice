services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: auth-services

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      DEBUG: "True"

    env_file:
      - .env

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload