services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    
    container_name: cart-services

    ports:
      -"8002:8002"
    
    volumes:
     - :'.:/app'

    environment:
      - DEBUG=True
      
    env_file:
      - .env
    
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
